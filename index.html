<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>⚔ Pixel Quest</h1>

  <div class="stats">
    ❤️ Health: <span id="health">100</span>
    💎 Coins: <span id="coins">50</span>
    ⚔ Weapon: <span id="weapon">Rusty Sword</span>
  </div>

  <canvas id="game" width="800" height="450"></canvas>

  <p>Move with WASD or arrow keys. Press SPACE to attack.</p>

  <section>
    <h2>Weapon Shop</h2>
    <button onclick="buyWeapon(0)">Rusty Sword - Free</button>
    <button onclick="buyWeapon(1)">Flame Blade - 35 coins</button>
    <button onclick="buyWeapon(2)">Thunder Hammer - 75 coins</button>
  </section>

  <h2>Unlockable Characters</h2>
  <p id="hero">🔒 Shadow Mage — Defeat the boss to unlock</p>
  <p id="message">Defeat the Forest Beast!</p>

  <script src="game.js"></script>
</body>
</html>
